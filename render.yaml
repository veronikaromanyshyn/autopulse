services:
  - type: web
    name: autopulse
    runtime: ruby
    plan: free
    buildCommand: bundle install && bin/rails assets:precompile && bin/rails db:migrate && bin/rails db:seed
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"

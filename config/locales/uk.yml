uk:
  date:
    formats:
      default: "%d.%m.%Y"
    month_names: [~, січня, лютого, березня, квітня, травня, червня, липня, серпня, вересня, жовтня, листопада, грудня]
    abbr_month_names: [~, січ, лют, бер, кві, тра, чер, лип, сер, вер, жов, лис, гру]
    order:
      - :day
      - :month
      - :year
  time:
    formats:
      default: "%d.%m.%Y %H:%M"
      short: "%d.%m.%Y"
  number:
    currency:
      format:
        unit: "₴"
        format: "%n %u"
        separator: ","
        delimiter: " "
        precision: 2
        strip_insignificant_zeros: true
  helpers:
    submit:
      create: "Зберегти"
      update: "Зберегти зміни"
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "не може бути порожнім"
      taken: "вже використовується"
      invalid: "має невірний формат"
      too_short: "занадто короткий (мінімум %{count} символів)"
      too_long: "занадто довгий (максимум %{count} символів)"
      confirmation: "не збігається з паролем"
      inclusion: "має недопустиме значення"
      not_a_number: "має бути числом"
      not_an_integer: "має бути цілим числом"
      greater_than: "має бути більше %{count}"
      greater_than_or_equal_to: "має бути не менше %{count}"
      required: "має бути вказано"
      restrict_dependent_destroy:
        has_many: "має пов'язані записи: %{record}"
  activerecord:
    errors:
      messages:
        record_invalid: "Помилки валідації: %{errors}"
